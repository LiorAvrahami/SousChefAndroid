name: On-device smoke test

# Boots an Android emulator, installs the app and drives it like a user would.
# It does not block the release build (build.yml); it exists to catch crashes and
# broken flows that compiling alone cannot detect. Screenshots and logs are uploaded
# as an artifact named "ui-test-output".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-test-main
  cancel-in-progress: true

jobs:
  emulator:
    name: Smoke test on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/*.sh

      # Two builds of the same app that differ only in version code, to prove that
      # installing an update keeps the user's recipes.
      - name: Build app (version 1), app (version 2) and test APK
        run: |
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PversionCode=1 -PversionName=1.0.1-test
          mkdir -p ui-test-apks
          cp app/build/outputs/apk/debug/app-debug.apk ui-test-apks/app-v1.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ui-test-apks/app-test.apk
          ./gradlew --no-daemon assembleDebug -PversionCode=2 -PversionName=1.0.2-test
          cp app/build/outputs/apk/debug/app-debug.apk ui-test-apks/app-v2.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ui-tests.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-output
          path: ui-test-output/
          if-no-files-found: warn
          retention-days: 14
