name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and publish release
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION_NAME }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "SousChef-v${{ env.VERSION_NAME }}.apk"

      - name: Publish GitHub release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Sous Chef v${{ env.VERSION_NAME }}
          body: |
            Built automatically from commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            Download the APK below and open it on your phone to install or update.
          files: SousChef-v${{ env.VERSION_NAME }}.apk
